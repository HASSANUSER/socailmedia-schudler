services:
  - type: web
    name: shorts-ai-scheduler
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_DATA_DIR
        value: /var/data
      - key: APP_PASSWORD
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
    disk:
      name: shorts-scheduler-data
      mountPath: /var/data
      sizeGB: 10
